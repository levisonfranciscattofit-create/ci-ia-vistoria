<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielo Dash | Insights de Gestão</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --cielo: #00aeef; --danger: #ff4b5c; --warning: #facc15; --bg: #010a12; }
    body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 20px; }
    
    h1 { font-family: 'Orbitron'; color: var(--cielo); text-align: center; font-size: 22px; margin-bottom: 30px; }

    /* ÁREA DE INSIGHTS */
    .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .card-insight { background: rgba(255,255,255,0.05); border-left: 5px solid var(--cielo); padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .card-insight.alerta { border-left-color: var(--danger); }
    .card-insight h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: #64748b; }
    .card-insight p { margin: 0; font-size: 20px; font-weight: bold; }
    .card-insight small { color: #94a3b8; font-size: 12px; }

    /* TABELA */
    .table-container { background: rgba(255,255,255,0.03); border-radius: 15px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(0, 174, 239, 0.2); padding: 15px; font-family: 'Orbitron'; font-size: 12px; color: var(--cielo); }
    td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
    .tag { background: var(--danger); padding: 4px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; margin-right: 5px; }
    .tag-ok { background: #10b981; }

    @media (max-width: 600px) { th, td { padding: 10px; font-size: 12px; } }
  </style>
</head>
<body>

  <h1>DASHBOARD DE GESTÃO - CIELO</h1>

  <div class="insights-grid" id="insightsArea">
    <div class="card-insight">
      <h3>Total Vistoriado</h3>
      <p id="totalCount">0</p>
      <small>Equipamentos processados</small>
    </div>
    <div class="card-insight" id="pontoAtencaoCard">
      <h3>Ponto de Atenção</h3>
      <p id="topDefeito">-</p>
      <small>Defeito mais recorrente</small>
    </div>
    <div class="card-insight alerta" id="alertaGraveCard">
      <h3>Índice de Avarias</h3>
      <p id="taxaErro">0%</p>
      <small>Máquinas com defeito</small>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>DATA</th>
          <th>SERIAL</th>
          <th>RESULTADO</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo">
        </tbody>
    </table>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref("inspecao").on("value", (snapshot) => {
    const data = snapshot.val();
    const tabela = document.getElementById("tabelaCorpo");
    tabela.innerHTML = "";
    
    let total = 0;
    let comErro = 0;
    let contagemDefeitos = {};

    // Inverte para ver os mais recentes primeiro
    const entries = Object.values(data || {}).reverse();

    entries.forEach(item => {
        total++;
        let statusHtml = "";
        
        if (!item.defeitos || item.defeitos.length === 0) {
            statusHtml = "<span class='tag tag-ok'>CONFORME</span>";
        } else {
            comErro++;
            item.defeitos.forEach(d => {
                statusHtml += `<span class='tag'>${d}</span>`;
                contagemDefeitos[d] = (contagemDefeitos[d] || 0) + 1;
            });
        }

        const row = `<tr>
            <td>${item.data.split(",")[0]}</td>
            <td><strong>${item.serial}</strong></td>
            <td>${statusHtml}</td>
        </tr>`;
        tabela.innerHTML += row;
    });

    // --- LÓGICA DE INSIGHTS ---
    document.getElementById("totalCount").innerText = total;
    
    // Calcula defeito mais comum
    let maisComum = "-";
    let max = 0;
    for(let d in contagemDefeitos) {
        if(contagemDefeitos[d] > max) {
            max = contagemDefeitos[d];
            maisComum = d;
        }
    }
    document.getElementById("topDefeito").innerText = maisComum;

    // Calcula taxa de erro
    const taxa = total > 0 ? ((comErro / total) * 100).toFixed(1) : 0;
    document.getElementById("taxaErro").innerText = taxa + "%";

    // Alerta visual se taxa de erro passar de 30%
    if(taxa > 30) {
        document.getElementById("alertaGraveCard").style.background = "rgba(255, 75, 92, 0.1)";
    }
});
</script>
</body>
</html>
