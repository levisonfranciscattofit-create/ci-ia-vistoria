<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielo | Plant Management Dash</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --cielo: #00aeef; --danger: #ff4b5c; --success: #10b981; --bg: #0b0f19; }
    body { background: var(--bg); color: #e2e8f0; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 20px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    h1 { font-family: 'Orbitron'; color: var(--cielo); font-size: 1.5rem; margin: 0; }

    /* GRID DE KPIs GIGANTES */
    .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .kpi-card { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; text-align: center; }
    .kpi-card h3 { margin: 0; font-size: 14px; color: #8b949e; text-transform: uppercase; }
    .kpi-card p { margin: 10px 0 0; font-size: 32px; font-weight: bold; font-family: 'Orbitron'; }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }

    /* GRÁFICOS */
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .chart-box { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; height: 350px; }
    .chart-box h4 { margin: 0 0 15px; font-size: 16px; color: var(--cielo); text-transform: uppercase; text-align: center; }

    /* TABELA DE ALERTA */
    .alert-table { background: #161b22; border-radius: 12px; overflow: hidden; border: 1px solid #30363d; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0d1117; padding: 15px; color: var(--cielo); text-align: left; font-size: 12px; }
    td { padding: 12px 15px; border-bottom: 1px solid #30363d; font-size: 14px; }
    .badge-error { background: rgba(255, 75, 92, 0.2); color: var(--danger); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 5px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>PLANT MANAGEMENT | CIELO</h1>
    <div id="lastUpdate" style="font-size: 12px; color: #8b949e;">Sincronizado agora</div>
  </div>

  <div class="kpi-container">
    <div class="kpi-card">
      <h3>Produtividade Total</h3>
      <p id="kpiTotal">0</p>
    </div>
    <div class="kpi-card">
      <h3>Prontas p/ Uso</h3>
      <p id="kpiOk" class="text-success">0</p>
    </div>
    <div class="kpi-card">
      <h3>Avariadas</h3>
      <p id="kpiErro" class="text-danger">0</p>
    </div>
    <div class="kpi-card">
      <h3>Health Score</h3>
      <p id="kpiScore">0%</p>
    </div>
  </div>

  <div class="charts-grid">
    <div class="chart-box">
      <h4>Status da Frota</h4>
      <canvas id="chartPizza"></canvas>
    </div>
    <div class="chart-box">
      <h4>Principais Causas de Reparo</h4>
      <canvas id="chartBarras"></canvas>
    </div>
  </div>

  <div class="alert-table">
    <h4 style="padding: 15px; margin: 0; background: #0d1117; color: #fff; font-size: 14px;">LOG DE OCORRÊNCIAS RECENTES</h4>
    <table>
      <thead>
        <tr>
          <th>SERIAL</th>
          <th>HORÁRIO</th>
          <th>FALHAS DETECTADAS</th>
        </tr>
      </thead>
      <tbody id="logCorpo"></tbody>
    </table>
  </div>

<script>
// --- FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let pizzaChart, barrasChart;

db.ref("inspecao").on("value", (snapshot) => {
    const data = snapshot.val();
    const items = Object.values(data || {}).reverse();
    
    let ok = 0, erro = 0;
    let defeitosFreq = {};
    const logCorpo = document.getElementById("logCorpo");
    logCorpo.innerHTML = "";

    items.forEach((item, index) => {
        const temErro = item.defeitos && item.defeitos.length > 0;
        if (temErro) {
            erro++;
            item.defeitos.forEach(d => { defeitosFreq[d] = (defeitosFreq[d] || 0) + 1; });
        } else {
            ok++;
        }

        // Popula tabela (apenas últimos 5 para não poluir)
        if(index < 5) {
            let tags = temErro ? item.defeitos.map(d => `<span class="badge-error">${d}</span>`).join("") : '<span class="text-success">Nenhuma</span>';
            logCorpo.innerHTML += `<tr><td><strong>${item.serial}</strong></td><td>${item.data.split(",")[1]}</td><td>${tags}</td></tr>`;
        }
    });

    // Atualiza KPIs
    const total = ok + erro;
    document.getElementById("kpiTotal").innerText = total;
    document.getElementById("kpiOk").innerText = ok;
    document.getElementById("kpiErro").innerText = erro;
    document.getElementById("kpiScore").innerText = total > 0 ? Math.round((ok/total)*100) + "%" : "0%";

    renderCharts(ok, erro, defeitosFreq);
    document.getElementById("lastUpdate").innerText = "Última atualização: " + new Date().toLocaleTimeString();
});

function renderCharts(ok, erro, defeitosFreq) {
    const ctxPizza = document.getElementById('chartPizza').getContext('2d');
    const ctxBarras = document.getElementById('chartBarras').getContext('2d');

    if (pizzaChart) pizzaChart.destroy();
    if (barrasChart) barrasChart.destroy();

    pizzaChart = new Chart(ctxPizza, {
        type: 'doughnut',
        data: {
            labels: ['Prontas', 'Avariadas'],
            datasets: [{
                data: [ok, erro],
                backgroundColor: ['#10b981', '#ff4b5c'],
                borderWidth: 0,
                hoverOffset: 10
            }]
        },
        options: { plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } }, maintainAspectRatio: false }
    });

    barrasChart = new Chart(ctxBarras, {
        type: 'bar',
        data: {
            labels: Object.keys(defeitosFreq),
            datasets: [{
                label: 'Ocorrências',
                data: Object.values(defeitosFreq),
                backgroundColor: '#00aeef'
            }]
        },
        options: { 
            scales: { 
                y: { beginAtZero: true, ticks: { color: '#8b949e' } },
                x: { ticks: { color: '#8b949e' } }
            },
            plugins: { legend: { display: false } },
            maintainAspectRatio: false
        }
    });
}
</script>
</body>
</html>
