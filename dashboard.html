<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Executivo | Inspeção</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
    h1 { font-weight: 700; margin-bottom: 30px; border-left: 5px solid var(--accent); padding-left: 15px; }
    
    /* Grid de KPIs */
    .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .kpi-card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; border: 1px solid #334155; }
    .kpi-card h3 { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; margin: 0; }
    .kpi-card h1 { border: none; padding: 0; margin: 10px 0 0; color: var(--accent); font-size: 2.5rem; }

    /* Layout dos Gráficos */
    .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .chart-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    
    @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <h1>📊 Dashboard Executivo de Qualidade</h1>

  <div class="kpi-container">
    <div class="kpi-card"><h3>Total Inspecionado</h3><h1 id="total">0</h1></div>
    <div class="kpi-card"><h3>Itens com Defeito</h3><h1 id="com-defeito">0</h1></div>
    <div class="kpi-card"><h3>Média de Erros/Item</h3><h1 id="media">0</h1></div>
    <div class="kpi-card"><h3>First Pass Yield (%)</h3><h1 id="taxa">0%</h1></div>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <h3>Pareto: Principais Falhas Detectadas</h3>
      <canvas id="rankingChart"></canvas>
    </div>
    <div class="chart-card">
      <h3>Composição de Qualidade</h3>
      <canvas id="yieldChart"></canvas>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Variáveis globais para os gráficos
let rankingChart, yieldChart;

onValue(ref(db, "inspecao"), (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  let totalItems = 0;
  let totalDefeitosNoPeriodo = 0;
  let itensComDefeito = 0;
  let contadorFalhas = {};

  for (let key in data) {
    totalItems++;
    const item = data[key];
    const defeitos = item.defeitos || [];
    
    if (defeitos.length > 0) {
      itensComDefeito++;
      totalDefeitosNoPeriodo += defeitos.length;
      defeitos.forEach(d => {
        contadorFalhas[d] = (contadorFalhas[d] || 0) + 1;
      });
    }
  }

  // Cálculos de KPIs
  const fpy = (((totalItems - itensComDefeito) / totalItems) * 100).toFixed(1);
  const mediaErros = (totalDefeitosNoPeriodo / totalItems).toFixed(2);

  // Atualizar UI
  document.getElementById("total").innerText = totalItems;
  document.getElementById("com-defeito").innerText = itensComDefeito;
  document.getElementById("media").innerText = mediaErros;
  document.getElementById("taxa").innerText = fpy + "%";

  updateCharts(contadorFalhas, totalItems, itensComDefeito);
});

function updateCharts(falhas, total, comDefeito) {
  const labels = Object.keys(falhas);
  const valores = Object.values(falhas);
  const semDefeito = total - comDefeito;

  // Destruir gráficos anteriores para atualizar
  if (rankingChart) rankingChart.destroy();
  if (yieldChart) yieldChart.destroy();

  // 1. Gráfico de Barras (Ranking de Falhas)
  const ctx1 = document.getElementById('rankingChart').getContext('2d');
  rankingChart = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Ocorrências',
        data: valores,
        backgroundColor: '#38bdf8'
      }]
    },
    options: { 
        indexAxis: 'y', 
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { color: '#334155' } }, y: { grid: { display: false } } }
    }
  });

  // 2. Gráfico de Rosca (Qualidade Geral)
  const ctx2 = document.getElementById('yieldChart').getContext('2d');
  yieldChart = new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: ['Conforme', 'Com Defeito'],
      datasets: [{
        data: [semDefeito, comDefeito],
        backgroundColor: ['#22c55e', '#ef4444'],
        borderWidth: 0
      }]
    },
    options: { cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
  });
}
</script>
</body>
</html>
