<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cielo Vistoria IA | V15 FINAL</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --cielo: #00aeef; --danger: #ff4b5c; --bg: #010a12; }
    body { background: radial-gradient(circle, #003d66 0%, var(--bg) 100%); color: white; font-family: 'Rajdhani', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(0, 174, 239, 0.3); border-radius: 40px; width: 450px; padding: 40px; text-align: center; }
    .logo { font-family: 'Orbitron'; color: var(--cielo); font-size: 24px; margin-bottom: 25px; text-shadow: 0 0 10px var(--cielo); }
    input { width: 100%; background: #000; border: 2px solid var(--cielo); border-radius: 15px; padding: 20px; color: #fff; text-align: center; font-size: 30px; font-family: 'Orbitron'; margin-bottom: 20px; outline: none; box-sizing: border-box; }
    #fala-preview { min-height: 100px; font-size: 20px; color: #facc15; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; line-height: 1.4; word-wrap: break-word; }
    .mic-pulse { width: 60px; height: 60px; background: var(--danger); border-radius: 50%; margin: 0 auto 20px; display: none; animation: pulse 1s infinite; align-items: center; justify-content: center; font-size: 24px; }
    .btn-finalizar { width: 100%; padding: 20px; border-radius: 15px; border: none; background: var(--cielo); color: white; font-weight: bold; font-size: 18px; cursor: pointer; display: none; margin-bottom: 10px; }
    .erro-box { background: rgba(255, 75, 92, 0.2); border-left: 5px solid var(--danger); padding: 12px; margin-top: 10px; text-align: left; font-size: 18px; font-weight: bold; }
    #timer { font-size: 80px; font-weight: 900; color: var(--cielo); }
    @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 75, 92, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(255, 75, 92, 0); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

<div class="glass">
  <div class="logo">CIELO VISTORIA V15</div>
  <input id="serialInput" type="text" placeholder="BIPE O SERIAL" autofocus autocomplete="off">
  
  <div id="micIcon" class="mic-pulse">🎤</div>
  <div id="fala-preview">Pronto para o bipe...</div>
  <div id="listaErros"></div>
  <button id="btnManual" class="btn-finalizar" onclick="forçarFinalizar()">CONFIRMAR VISTORIA</button>
  <div id="timer"></div>
</div>

<script>
// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// DICIONÁRIO COMPLETO
const dicionario = {
    "DISPLAY QUEBRADO/TRINCADO": ["tela", "display", "visor", "quebrad", "trinc", "rach", "vidro"],
    "RISCOS NA TELA": ["risc", "arranh", "marc", "ralad"],
    "TECLAS DANIFICADAS": ["tecla", "botão", "botao", "teclado", "travad", "afund"],
    "FALTA DE RELEVO": ["liso", "relevo", "apagad", "lisa"]
};

let recognition;
let gravando = false;
let silêncioTimer;
let scannerTimer;
let textoAcumuladoGlobal = ""; // Onde guardamos TUDO sem apagar nada

document.getElementById('serialInput').addEventListener('input', function() {
    clearTimeout(scannerTimer);
    scannerTimer = setTimeout(() => { if(this.value.length > 2) iniciarVoz(); }, 250);
});

function iniciarVoz() {
    if(gravando) return;
    gravando = true;
    textoAcumuladoGlobal = ""; 
    
    document.getElementById('micIcon').style.display = "flex";
    document.getElementById('btnManual').style.display = "block";
    document.getElementById('fala-preview').innerText = "Ouvindo...";

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new Speech();
    recognition.lang = "pt-BR";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let textoParcial = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) {
                // Soma a frase final ao acumulador global
                textoAcumuladoGlobal += event.results[i][0].transcript + " ";
            } else {
                textoParcial = event.results[i][0].transcript;
            }
        }
        
        // Atualiza a tela com TUDO o que foi falado até agora + o que está sendo processado
        const textoCompleto = (textoAcumuladoGlobal + textoParcial).toLowerCase();
        document.getElementById('fala-preview').innerText = textoCompleto;

        // Reset do silêncio (6 segundos para dar tempo de bipar e falar com calma)
        clearTimeout(silêncioTimer);
        silêncioTimer = setTimeout(() => { if(gravando) forçarFinalizar(); }, 6000);

        // Comando de voz rápido para fechar
        if (textoCompleto.includes("ok") || textoCompleto.includes("pronto") || textoCompleto.includes("finalizar")) {
            forçarFinalizar();
        }
    };

    recognition.start();
}

function forçarFinalizar() {
    if(!gravando) return;
    gravando = false;
    
    // Pega o texto final EXATAMENTE como está na tela
    const textoFinal = document.getElementById('fala-preview').innerText.toLowerCase();
    
    if(recognition) recognition.stop();
    clearTimeout(silêncioTimer);

    document.getElementById('micIcon').style.display = "none";
    document.getElementById('btnManual').style.display = "none";
    
    const encontrados = [];

    // VARREDURA INDEPENDENTE (Checa cada item do dicionário no texto todo)
    for (let erro in dicionario) {
        const palavrasChave = dicionario[erro];
        if (palavrasChave.some(p => textoFinal.includes(p))) {
            encontrados.push(erro);
        }
    }

    const list = document.getElementById('listaErros');
    if(encontrados.length === 0) {
        list.innerHTML = "<h2 style='color:var(--cielo)'>✓ EQUIPAMENTO OK</h2>";
    } else {
        encontrados.forEach(e => { 
            list.innerHTML += `<div class="erro-box">❌ ${e}</div>`; 
        });
    }

    // SALVAR NO FIREBASE
    db.ref("inspecao").push({
        serial: document.getElementById('serialInput').value.toUpperCase(),
        defeitos: encontrados,
        transcricao: textoFinal,
        data: new Date().toLocaleString()
    });

    // CONTAGEM PARA RESET
    let c = 5;
    const t = setInterval(() => {
        document.getElementById('timer').innerText = c--;
        if(c < 0) { clearInterval(t); location.reload(); }
    }, 1000);
}
</script>
</body>
</html>
