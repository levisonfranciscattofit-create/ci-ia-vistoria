<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cielo Vistoria | V10.4 Final</title>
  <style>
    :root { --primary: #0ea5e9; --danger: #ef4444; --bg: #020617; --card: #0f172a; }
    body { background: var(--bg); color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: var(--card); border: 2px solid #1e293b; border-radius: 24px; width: 450px; padding: 40px; text-align: center; }
    input { width: 100%; background: #000; border: 2px solid #334155; border-radius: 16px; padding: 20px; color: var(--primary); text-align: center; font-size: 32px; font-weight: bold; margin-bottom: 25px; outline: none; }
    .status-badge { width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; }
    .listening { background: var(--danger); animation: pulse 1.5s infinite; }
    .waiting { background: #1e293b; color: #64748b; }
    #fala-preview { color: #facc15; font-style: italic; font-size: 18px; min-height: 60px; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="card">
  <div style="font-size:22px; font-weight:800; margin-bottom:20px;">CIELO <span>VISTORIA</span></div>
  <input id="serialInput" type="text" placeholder="ESCANEIE O SERIAL" autofocus>
  <div id="badge" class="status-badge waiting">Aguardando Scanner...</div>
  <div id="liveArea" style="display:none">
    <div id="fala-preview">Iniciando microfone...</div>
    <div id="resultsList"></div>
  </div>
</div>

<script>
let recognition;
let gravando = false;
let inputTimer;

// Foco constante
document.onclick = () => document.getElementById('serialInput').focus();

// AUTO-SUBMIT: Detecta o fim da digitação do Scanner (espera 300ms de silêncio no teclado)
document.getElementById('serialInput').addEventListener('input', function() {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
        if(this.value.length > 3) startVistoria();
    }, 300); 
});

function startVistoria() {
    if(gravando) return;
    gravando = true;

    document.getElementById('badge').innerText = "🛑 OUVINDO...";
    document.getElementById('badge').className = "status-badge listening";
    document.getElementById('liveArea').style.display = "block";

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new Speech();
    recognition.lang = "pt-BR";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let texto = "";
        for (let i = 0; i < event.results.length; i++) {
            texto += event.results[i][0].transcript;
        }
        document.getElementById('fala-preview').innerText = `"${texto.toLowerCase()}"`;
        
        if (["finalizar", "pronto", "ok", "parar"].some(cmd => texto.toLowerCase().includes(cmd))) {
            finalizar(texto.toLowerCase());
        }
    };

    recognition.onerror = (event) => {
        console.log("Erro:", event.error);
        if(event.error === 'network') {
            document.getElementById('fala-preview').innerText = "Erro de Rede. Tentando reconectar...";
            setTimeout(() => { if(gravando) recognition.start(); }, 1000);
        }
    };

    try { recognition.start(); } catch(e) { console.log(e); }
}

function finalizar(textoFinal) {
    gravando = false;
    recognition.stop();
    document.getElementById('badge').innerText = "FINALIZADO";
    document.getElementById('badge').className = "status-badge waiting";
    
    // Aqui você pode inserir o código de salvar no Firebase que te passei antes
    
    setTimeout(() => location.reload(), 4000);
}
</script>
</body>
</html>
