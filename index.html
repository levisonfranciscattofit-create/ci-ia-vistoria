<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielo Vistoria V9.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-[#020617] text-white font-sans flex items-center justify-center min-h-screen m-0 p-4">

  <div class="bg-[#0f172a] border-2 border-sky-500 rounded-3xl w-full max-w-sm p-8 text-center shadow-2xl">
    <img src="https://logodownload.org/wp-content/uploads/2014/07/cielo-logo-1.png" alt="Cielo" class="h-5 mx-auto mb-10">
    
    <input id="serial" type="text" placeholder="SERIAL" class="w-full bg-black border border-slate-700 rounded-2xl p-5 text-center text-2xl text-sky-400 mb-8 outline-none uppercase font-mono">
    
    <button id="btnMain" onclick="iniciar()" class="w-full bg-sky-600 text-white font-black py-6 rounded-3xl text-xl uppercase">🎙️ Iniciar Voz</button>
    <button id="btnStop" onclick="finalizarCiclo()" class="hidden w-full bg-red-600 text-white font-black py-6 rounded-3xl text-xl animate-pulse uppercase">🛑 Finalizar</button>

    <div id="statusArea" class="hidden mt-10 pt-8 border-t border-slate-800">
      <p id="fala" class="text-yellow-400 italic font-bold mb-8 text-center text-lg">Ouvindo...</p>
      <div id="lista" class="space-y-3"></div>
      <h1 id="contador" class="text-8xl font-black mt-8 text-center"></h1>
    </div>
  </div>

<script>
// Configuração do Firebase (Versão Antiga/Compatível)
var firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var dicionario = {
    "DISPLAY QUEBRADO": ["tela", "display", "visor", "quebrado", "trincado", "rachado", "vidro"],
    "RISCOS NA TELA": ["risco", "riscada", "arranhado", "arranhão", "ralado", "marcado"],
    "FUGA DE LUZ": ["luz", "vazamento", "brilho", "fuga", "borda"],
    "TECLAS DANIFICADAS": ["tecla", "botão", "teclado", "travado", "afundado", "botões"],
    "FALTA DE RELEVO": ["liso", "relevo", "apagado", "serigrafia", "lisa"]
};

var comandosParar = ["finalizar", "concluir", "feito", "pronto", "terminar", "parar", "ok"];
var recognition;
var ouvindoAtivo = false;

function iniciar() {
    var serial = document.getElementById("serial").value.trim();
    if(!serial) return alert("Digite o Serial!");

    ouvindoAtivo = true;
    document.getElementById("btnMain").classList.add("hidden");
    document.getElementById("btnStop").classList.remove("hidden");
    document.getElementById("statusArea").classList.remove("hidden");
    document.getElementById("lista").innerHTML = "";

    var Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Speech) return alert("Navegador não suporta voz!");

    recognition = new Speech();
    recognition.lang = "pt-BR";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = function(e) {
        if(!ouvindoAtivo) return;
        var total = "";
        for (var i = 0; i < e.results.length; i++) {
            total += e.results[i][0].transcript;
        }
        total = total.toLowerCase();
        document.getElementById("fala").innerText = total;

        for (var j = 0; j < comandosParar.length; j++) {
            if (total.indexOf(comandosParar[j]) !== -1) {
                finalizarCiclo();
                break;
            }
        }
    };
    recognition.start();
}

function finalizarCiclo() {
    if(!ouvindoAtivo) return;
    ouvindoAtivo = false;
    if(recognition) { try { recognition.stop(); } catch(err){} }

    document.getElementById("btnStop").classList.add("hidden");
    var falaTecnico = document.getElementById("fala").innerText.toLowerCase();
    var errosEncontrados = [];

    for (var erro in dicionario) {
        var palavras = dicionario[erro];
        for (var k = 0; k < palavras.length; k++) {
            if (falaTecnico.indexOf(palavras[k]) !== -1) {
                errosEncontrados.push(erro);
                break;
            }
        }
    }

    var ui = document.getElementById("lista");
    if(errosEncontrados.length === 0) {
        ui.innerHTML = "<p class='text-green-400 font-black text-center text-xl'>✓ OK</p>";
    } else {
        errosEncontrados.forEach(function(e) {
            ui.innerHTML += '<div class="bg-red-500/10 border-l-4 border-red-500 p-4 text-xs font-black uppercase">❌ ' + e + '</div>';
        });
    }

    db.ref("inspecao").push({
        serial: document.getElementById("serial").value.toUpperCase(),
        defeitos: errosEncontrados,
        transcricao: falaTecnico,
        data: new Date().toLocaleString()
    });

    var c = 5;
    var t = setInterval(function() {
        document.getElementById("contador").innerText = c--;
        if(c < 0) { clearInterval(t); location.reload(); }
    }, 1000);
}
</script>
</body>
</html>
