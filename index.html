<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielo IA | DEFINITIVA V8</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .cielo-card { background: linear-gradient(145deg, #0f172a, #1e293b); border: 2px solid #38bdf8; border-radius: 32px; width: 95%; max-width: 500px; padding: 2rem; box-shadow: 0 0 50px rgba(56, 189, 248, 0.2); }
    .btn-glow { transition: all 0.3s ease; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
    .btn-glow:hover { box-shadow: 0 0 30px rgba(56, 189, 248, 0.6); transform: scale(1.02); }
    .dot-flashing { position: relative; width: 10px; height: 10px; border-radius: 5px; background-color: #38bdf8; animation: dot-flashing 1s infinite linear alternate; }
    @keyframes dot-flashing { 0% { background-color: #38bdf8; } 50%, 100% { background-color: #0f172a; } }
  </style>
</head>
<body>

  <div class="cielo-card text-center">
    <img src="https://logodownload.org/wp-content/uploads/2014/07/cielo-logo-1.png" alt="Cielo" class="h-8 mx-auto mb-6">
    
    <h1 class="text-2xl font-black text-white mb-2 uppercase tracking-tighter">Vistoria Blindada <span class="text-sky-400 text-sm block">V8.0 FINAL</span></h1>
    
    <div class="space-y-4 mt-6">
      <input id="serial" type="text" placeholder="SERIAL DO EQUIPAMENTO" class="w-full bg-black border-2 border-slate-700 rounded-2xl px-4 py-5 text-center text-2xl font-mono text-sky-400 outline-none focus:border-sky-400 transition-all uppercase tracking-widest">
      
      <button id="btnMain" onclick="iniciar()" class="w-full bg-sky-600 btn-glow text-white font-black py-6 rounded-2xl flex items-center justify-center gap-3 text-xl transition-all active:scale-95">
        🎙️ CLIQUE PARA FALAR
      </button>

      <button id="btnStopManual" onclick="forcarFinalizar()" class="hidden w-full bg-red-600 text-white font-black py-4 rounded-2xl flex items-center justify-center gap-2 uppercase text-xs tracking-widest animate-pulse">
        🛑 PARAR AGORA (IA)
      </button>
    </div>

    <div id="statusArea" class="hidden mt-8 pt-8 border-t border-slate-800">
      <div class="flex items-center justify-center gap-2 mb-4">
        <div class="dot-flashing"></div>
        <span id="statusLabel" class="text-xs font-bold text-sky-400 uppercase tracking-widest">Gravando Áudio...</span>
      </div>
      
      <div class="bg-black/50 rounded-2xl p-6 mb-6 border border-white/5 min-h-[120px]">
        <p id="fala" class="text-yellow-400 text-lg font-bold italic leading-tight">Aguardando...</p>
      </div>

      <div id="aiResults" class="hidden text-left bg-slate-900 rounded-xl p-4 border border-sky-500/30">
        <p class="text-[10px] text-slate-500 uppercase font-black mb-3">Defeitos Capturados:</p>
        <div id="lista" class="space-y-2"></div>
      </div>

      <h1 id="contador" class="text-8xl font-black text-white mt-4"></h1>
    </div>

    <div id="debug" class="mt-4 text-[8px] text-red-500 font-mono opacity-30 break-all"></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const OPENAI_API_KEY = "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"; // ⚠️ INSIRA SUA KEY AQUI

const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let recognition;
let chunks = []; // Buffer de segurança
let sGlobal = "";

// LISTA TOTAL - BASEADA NO SEU ARQUIVO CSV
const listaMestra = [
  "GABINETE SUPERIOR (PRESTADOR)", "AMASSADOS (INCLUSIVE AO REDOR DO DISPLAY VISOR)", "RISCO/ARRANHADOS/RALADOS SUPERIOR", "MANCHAS GABINETE SUPERIOR", "SERIGRAFIA AUSENTE/DESGASTADO", "GABINETE INFERIOR (PRESTADOR)", "AMASSADOS GABINETE INFERIOR", "RISCOS/ARRANHADOS/RALADOS INFERIOR", "MANCHAS GABINETE INFERIOR", "PROBLEMA DE DISPLAY/VISOR (FABRICANTE)", "RISCOS OU PONTOS VISIVEIS NO DISPLAY/VISOR APÓS LIGADO", "QUEBRADOS OU TRINCADOS NO DISPLAY VISOR", "TECLAS QUEBRADAS/AVARIADAS", "FUGA DE LUZ EM VOLTA DO CARACTER", "FUGA DE LUZ NO VISOR", "NÃO LIGA", "ALERT/TAMPER", "NÃO CARREGA BATERIA", "TECLADO NÃO FUNCIONA", "NÃO LÊ CHIP DO CARTÃO", "TAMPA DA BOBINA NÃO FECHA", "AUSÊNCIA DE PARAFUSO", "PEZAO QUEBRADO"
];

function iniciar() {
  const s = document.getElementById("serial").value.trim();
  if (!s) return alert("Insira o Serial!");
  sGlobal = s;
  chunks = [];
  document.getElementById("btnMain").classList.add("hidden");
  document.getElementById("btnStopManual").classList.remove("hidden");
  document.getElementById("statusArea").classList.remove("hidden");
  
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = "pt-BR";
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    let parcial = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
        const tr = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
            chunks.push(tr);
        } else {
            parcial = tr;
        }
    }
    const textoVisivel = (chunks.join(" ") + " " + parcial).toLowerCase();
    document.getElementById("fala").innerText = `"${textoVisivel.trim()}"`;
    
    // GATILHO DE VOZ
    if (textoVisivel.includes("finalizar") || textoVisivel.includes("pronto")) {
      forcarFinalizar();
    }
  };
  recognition.start();
}

async function forcarFinalizar() {
  if (recognition) {
    recognition.onresult = null;
    try { recognition.abort(); } catch(e){} 
  }

  document.getElementById("btnStopManual").classList.add("hidden");
  document.getElementById("statusLabel").innerText = "AUDITANDO FALHAS...";
  
  // Consolida o que foi ouvido eliminando lixo
  const relatoFinal = chunks.join(" ").toLowerCase()
    .replace(/finalizar|pronto|vírgula|ponto| e /gi, " ")
    .trim();

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + OPENAI_API_KEY },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          { role: "system", content: "Aja como um auditor técnico. O usuário citará vários problemas. Liste TODOS os itens da lista oficial mencionados. Não ignore nenhum. Retorne apenas JSON no formato: {\"defeitos\": [\"Item 1\", \"Item 2\"]}. Lista: " + listaMestra.join(", ") },
          { role: "user", content: "O técnico relatou: " + relatoFinal }
        ],
        temperature: 0,
        response_format: { "type": "json_object" }
      })
    });

    const data = await response.json();
    const result = JSON.parse(data.choices[0].message.content);
    const finais = result.defeitos.filter(d => listaMestra.includes(d));

    exibirESalvar(finais, relatoFinal);
  } catch (e) {
    document.getElementById("debug").innerText = "Erro IA: " + e.message;
  }
}

function exibirESalvar(defeitos, texto) {
  document.getElementById("aiResults").classList.remove("hidden");
  const listaUI = document.getElementById("lista");
  listaUI.innerHTML = "";

  if (defeitos.length === 0) {
    listaUI.innerHTML = "<div class='text-green-400 font-bold text-center'>EQUIPAMENTO OK</div>";
  } else {
    defeitos.forEach(d => {
      const div = document.createElement("div");
      div.className = "bg-red-500/20 border-l-4 border-red-500 p-3 text-xs font-black text-red-200 uppercase mb-1";
      div.innerText = "❌ " + d;
      listaUI.appendChild(div);
    });
  }

  // GRAVAÇÃO NO FIREBASE
  push(ref(db, "inspecao"), {
    serial: sGlobal,
    defeitos: defeitos,
    texto_bruto: texto,
    timestamp: new Date().toISOString()
  });

  // REINÍCIO
  let count = 4;
  document.getElementById("statusLabel").innerText = "REGISTRO CONCLUÍDO";
  const t = setInterval(() => {
    document.getElementById("contador").innerText = count;
    count--;
    if (count < 0) { clearInterval(t); location.reload(); }
  }, 1000);
}

window.iniciar = iniciar;
window.forcarFinalizar = forcarFinalizar;
</script>
</body>
</html>
