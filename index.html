<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cielo Vistoria IA | V12</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --cielo-blue: #00aeef; --cielo-dark: #002d4b; --danger: #ff4b5c; --bg: #010a12; }
    body { 
      background: radial-gradient(circle at center, #003d66 0%, var(--bg) 100%);
      color: white; font-family: 'Rajdhani', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden;
    }
    .glass-card { 
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(0, 174, 239, 0.3);
      border-radius: 40px; width: 450px; padding: 45px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.5);
    }
    .logo-cielo { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; margin-bottom: 35px; color: var(--cielo-blue); letter-spacing: 2px; }
    
    input#serialInput { 
      width: 100%; background: rgba(0,0,0,0.6); border: 2px solid var(--cielo-blue); border-radius: 20px; 
      padding: 22px; color: #fff; text-align: center; font-size: 36px; font-family: 'Orbitron'; margin-bottom: 30px; outline: none;
    }

    .mic-pulse {
      width: 80px; height: 80px; background: var(--danger); border-radius: 50%; margin: 0 auto 20px;
      display: none; align-items: center; justify-content: center; animation: pulse 1.5s infinite;
    }

    #fala-preview { 
      min-height: 80px; font-size: 20px; color: #add8e6; margin-bottom: 25px; 
      text-shadow: 0 0 10px rgba(0,174,239,0.5); font-weight: 500;
    }

    .btn-action { 
      width: 100%; padding: 20px; border-radius: 20px; border: none; color: white; font-weight: 700; 
      font-size: 18px; cursor: pointer; text-transform: uppercase; background: var(--cielo-blue); 
      display: none; transition: 0.3s;
    }

    .erro-tag { 
      background: rgba(255, 75, 92, 0.2); border: 1px solid var(--danger); padding: 12px; 
      margin: 10px 0; border-radius: 12px; font-weight: bold; text-align: left;
    }

    #timer-regressivo { font-size: 80px; font-weight: 900; color: #fff; margin-top: 25px; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 75, 92, 0.7); } 70% { box-shadow: 0 0 0 25px rgba(255, 75, 92, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 75, 92, 0); } }
  </style>
</head>
<body>

<div class="glass-card">
  <div class="logo-cielo">CIELO VISTORIA V12</div>
  
  <input id="serialInput" type="text" placeholder="BIPE O SERIAL" autofocus autocomplete="off">

  <div id="mic-area" class="mic-pulse">🎤</div>
  
  <div id="fala-preview">Escaneie para começar...</div>
  <div id="listaErros"></div>
  <div id="timer-regressivo"></div>

  <button id="btnManualSubmit" class="btn-action" onclick="finalizar()">FINALIZAR AGORA</button>
</div>

<script>
// --- FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const dicionario = {
    "DISPLAY QUEBRADO": ["tela", "display", "visor", "quebrado", "trincado", "rachado"],
    "RISCOS NA TELA": ["risco", "arranhado", "marcado"],
    "TECLAS DANIFICADAS": ["tecla", "botão", "teclado", "travado"],
    "FALTA DE RELEVO": ["liso", "relevo", "apagado"]
};

let recognition;
let isGravando = false;
let timeoutInativo;
let scannerTimer;

// Foco no input
document.onclick = () => document.getElementById('serialInput').focus();

document.getElementById('serialInput').addEventListener('input', function() {
    clearTimeout(scannerTimer);
    scannerTimer = setTimeout(() => {
        if(this.value.length > 2) iniciarVistoria();
    }, 250); 
});

function iniciarVistoria() {
    if(isGravando) return;
    isGravando = true;

    // UI Updates
    document.getElementById('mic-area').style.display = "flex";
    document.getElementById('btnManualSubmit').style.display = "block";
    document.getElementById('fala-preview').innerText = "Ouvindo falhas...";
    document.getElementById('serialInput').style.opacity = "0.3";
    document.getElementById('serialInput').readOnly = true;

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new Speech();
    recognition.lang = "pt-BR";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        
        let texto = transcript.toLowerCase();
        document.getElementById('fala-preview').innerText = `"${texto}"`;
        
        // --- 1. COMANDO DE VOZ SECO ---
        if (["ok", "pronto", "parar", "finalizar"].some(cmd => texto.includes(cmd))) {
            finalizar();
        }

        // --- 2. SILÊNCIO INTELIGENTE (4s) ---
        clearTimeout(timeoutInativo);
        timeoutInativo = setTimeout(() => {
            if(isGravando) finalizar();
        }, 4000); 
    };

    recognition.start();
}

function finalizar() {
    if(!isGravando) return;
    isGravando = false;
    
    if(recognition) recognition.stop();
    clearTimeout(timeoutInativo);

    // UI Changes
    document.getElementById('mic-area').style.display = "none";
    document.getElementById('btnManualSubmit').style.display = "none";
    document.getElementById('fala-preview').innerText = "Processando vistoria...";

    const textoFinal = document.getElementById('fala-preview').innerText.toLowerCase();
    const encontrados = [];
    for (const erro in dicionario) {
        if (dicionario[erro].some(p => textoFinal.includes(p))) {
            encontrados.push(erro);
        }
    }

    const list = document.getElementById('listaErros');
    if(encontrados.length === 0) {
        list.innerHTML = "<h2 style='color:#00aeef'>✓ EQUIPAMENTO EM PERFEITO ESTADO</h2>";
    } else {
        encontrados.forEach(err => {
            list.innerHTML += `<div class="erro-tag">❌ ${err}</div>`;
        });
    }

    // --- 3. SUBMETER AO FIREBASE ---
    db.ref("inspecao").push({
        serial: document.getElementById('serialInput').value.toUpperCase(),
        defeitos: encontrados,
        transcricao: textoFinal,
        data: new Date().toLocaleString()
    });

    // --- 4. REGRESSIVO DE 5s ---
    let c = 5;
    const t = setInterval(() => {
        document.getElementById('timer-regressivo').innerText = c--;
        if(c < 0) {
            clearInterval(t);
            location.reload();
        }
    }, 1000);
}
</script>
</body>
</html>
