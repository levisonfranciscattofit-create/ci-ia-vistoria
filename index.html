<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielo | V9.2 POC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020617] text-white font-sans flex items-center justify-center min-h-screen m-0 p-4">

  <div class="bg-[#0f172a] border-2 border-sky-500 rounded-3xl w-full max-w-sm p-8 text-center shadow-2xl">
    <img src="https://logodownload.org/wp-content/uploads/2014/07/cielo-logo-1.png" alt="Cielo" class="h-5 mx-auto mb-10">
    
    <input id="serial" type="text" placeholder="SERIAL" class="w-full bg-black border border-slate-700 rounded-2xl p-5 text-center text-2xl text-sky-400 mb-8 outline-none uppercase font-mono tracking-tighter">
    
    <button id="btnMain" onclick="iniciar()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-6 rounded-3xl text-xl uppercase tracking-widest transition-all">🎙️ Iniciar Voz</button>
    <button id="btnStop" onclick="finalizarCiclo()" class="hidden w-full bg-red-600 text-white font-black py-6 rounded-3xl text-xl animate-pulse uppercase">🛑 Parar / Finalizar</button>

    <div id="statusArea" class="hidden mt-10 pt-8 border-t border-slate-800 text-left">
      <p id="fala" class="text-yellow-400 italic font-bold mb-8 text-center text-lg leading-snug">Ouvindo...</p>
      <div id="lista" class="space-y-3"></div>
      <h1 id="contador" class="text-8xl font-black mt-8 text-white text-center"></h1>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const dicionario = {
    "DISPLAY QUEBRADO": ["tela", "display", "visor", "quebrado", "trincado", "rachado", "estourado", "partido", "vidro", "quebrada"],
    "RISCOS NA TELA": ["risco", "riscada", "arranhado", "arranhão", "ralado", "marcado", "riscos", "arranhada"],
    "FUGA DE LUZ": ["luz", "vazamento", "brilho lateral", "fuga", "borda branca", "mancha clara", "vazando"],
    "TECLAS DANIFICADAS": ["tecla", "botão", "teclado", "travado", "afundado", "solto", "não aperta", "botões", "teclas"],
    "FALTA DE RELEVO": ["liso", "relevo", "apagado", "serigrafia", "carcaça lisa", "sem marcação", "lisa"]
};

// COMANDOS PARA FECHAR O CICLO
const comandosParar = ["finalizar", "concluir", "feito", "pronto", "terminar", "finaliza", "concluído"];

let recognition;
let textoFinal = "";

window.iniciar = () => {
    const serial = document.getElementById("serial").value.trim();
    if(!serial) return alert("Digite o Serial!");

    document.getElementById("btnMain").classList.add("hidden");
    document.getElementById("btnStop").classList.remove("hidden");
    document.getElementById("statusArea").classList.remove("hidden");
    document.getElementById("lista").innerHTML = "";
    textoFinal = "";

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new Speech();
    recognition.lang = "pt-BR";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (e) => {
        let parcial = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) textoFinal += e.results[i][0].transcript;
            else parcial = e.results[i][0].transcript;
        }
        const total = (textoFinal + " " + parcial).toLowerCase();
        document.getElementById("fala").innerText = total;

        // Verifica se falou algum comando de parada
        const deveParar = comandosParar.some(cmd => total.includes(cmd));
        if(deveParar) {
            window.finalizarCiclo();
        }
    };
    recognition.start();
};

window.finalizarCiclo = () => {
    if(recognition) { 
        recognition.onresult = null; // Para de ouvir imediatamente
        try { recognition.stop(); } catch(e){} 
    }
    
    document.getElementById("btnStop").classList.add("hidden");
    const falaTecnico = document.getElementById("fala").innerText.toLowerCase();
    const errosEncontrados = [];

    // Lógica do Dicionário
    for (let erroOficial in dicionario) {
        const palavrasChave = dicionario[erroOficial];
        const encontrou = palavrasChave.some(palavra => falaTecnico.includes(palavra));
        if (encontrou) errosEncontrados.push(erroOficial);
    }

    const ui = document.getElementById("lista");
    if (errosEncontrados.length === 0) {
        ui.innerHTML = "<p class='text-green-400 font-black text-center text-xl uppercase font-mono tracking-tighter'>✓ EQUIPAMENTO OK</p>";
    } else {
        errosEncontrados.forEach(e => {
            ui.innerHTML += `<div class="bg-red-500/10 border-l-4 border-red-500 p-4 text-xs font-black text-left uppercase">❌ ${e}</div>`;
        });
    }

    // Salva no Firebase
    push(ref(db, "inspecao"), {
        serial: document.getElementById("serial").value.toUpperCase(),
        defeitos: errosEncontrados,
        transcricao: falaTecnico,
        data: new Date().toLocaleString()
    });

    // Contagem regressiva para novo teste
    let c = 5;
    const t = setInterval(() => {
        document.getElementById("contador").innerText = c--;
        if(c < 0) { clearInterval(t); location.reload(); }
    }, 1000);
};
</script>
</body>
</html>
