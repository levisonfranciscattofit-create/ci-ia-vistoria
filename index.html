<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cielo Vistoria | V10.2 Pro</title>
  <style>
    :root { --primary: #0ea5e9; --danger: #ef4444; --bg: #020617; --card: #0f172a; }
    body { background: var(--bg); color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: var(--card); border: 2px solid #1e293b; border-radius: 24px; width: 450px; padding: 40px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    .logo { font-size: 22px; font-weight: 800; margin-bottom: 30px; }
    .logo span { color: var(--primary); }
    input { width: 100%; background: #000; border: 2px solid #334155; border-radius: 16px; padding: 20px; color: var(--primary); text-align: center; font-size: 32px; font-weight: bold; margin-bottom: 25px; box-sizing: border-box; outline: none; }
    .status-badge { width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; text-transform: uppercase; font-size: 14px; margin-bottom: 20px; }
    .waiting { background: #1e293b; color: #64748b; }
    .listening { background: var(--danger); color: white; animation: pulse 1.5s infinite; }
    #fala-preview { color: #facc15; font-style: italic; font-size: 18px; min-height: 60px; margin-bottom: 20px; }
    .erro-card { background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--danger); padding: 12px; margin-top: 8px; text-align: left; font-size: 14px; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">CIELO <span>VISTORIA</span></div>
  <input id="serialInput" type="text" placeholder="BIPE O SERIAL" autofocus>
  <div id="badge" class="status-badge waiting">Aguardando Scanner...</div>
  <div id="liveArea" style="display:none">
    <div id="fala-preview">Iniciando microfone...</div>
    <div id="resultsList"></div>
    <h1 id="countdown"></h1>
  </div>
</div>

<script>
const dicionario = {
    "DISPLAY QUEBRADO": ["tela", "display", "visor", "quebrado", "trincado", "rachado", "vidro"],
    "RISCOS NA TELA": ["risco", "riscada", "arranhado", "arranhão", "marcado"],
    "TECLAS DANIFICADAS": ["tecla", "botão", "teclado", "travado", "afundado", "botões"],
    "FALTA DE RELEVO": ["liso", "relevo", "apagado", "lisa"]
};
const comandosParar = ["finalizar", "pronto", "concluir", "feito", "ok", "parar"];

let recognition;
let gravando = false;

// Garante o foco no input
document.getElementById('serialInput').focus();

document.getElementById('serialInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault(); // CRÍTICO: Impede o navegador de resetar a página
        if(this.value.trim() !== "") startVistoria();
    }
});

function startVistoria() {
    if(gravando) return;
    gravando = true;

    document.getElementById('badge').innerText = "🛑 OUVINDO...";
    document.getElementById('badge').className = "status-badge listening";
    document.getElementById('liveArea').style.display = "block";

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Speech) return alert("Navegador não suporta voz!");

    recognition = new Speech();
    recognition.lang = "pt-BR";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let texto = "";
        for (let i = 0; i < event.results.length; i++) {
            texto += event.results[i][0].transcript;
        }
        texto = texto.toLowerCase();
        document.getElementById('fala-preview').innerText = `"${texto}"`;

        if (comandosParar.some(cmd => texto.includes(cmd))) {
            finalizar(texto);
        }
    };

    recognition.onerror = (event) => {
        document.getElementById('fala-preview').innerText = "Erro no Mic: " + event.error;
        if(event.error === 'not-allowed') alert("Permita o microfone no cadeado lá em cima!");
    };

    recognition.start();
}

function finalizar(textoFinal) {
    gravando = false;
    if(recognition) recognition.stop();

    const encontrados = [];
    for (const erro in dicionario) {
        if (dicionario[erro].some(p => textoFinal.includes(p))) {
            encontrados.push(erro);
        }
    }

    const list = document.getElementById('resultsList');
    if(encontrados.length === 0) {
        list.innerHTML = "<b style='color:#4ade80'>✓ TUDO OK</b>";
    } else {
        encontrados.forEach(err => {
            list.innerHTML += `<div class="erro-card">❌ ${err}</div>`;
        });
    }

    let c = 5;
    setInterval(() => {
        document.getElementById('countdown').innerText = c--;
        if(c < 0) location.reload();
    }, 1000);
}
</script>
</body>
</html>
