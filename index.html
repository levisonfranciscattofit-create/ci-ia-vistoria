<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Cielo Vistoria | V22 Mobile</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --cielo: #00aeef; --danger: #ff4b5c; --bg: #010a12; }
    
    * { box-sizing: border-box; } /* Garante que o padding não quebre a largura */

    body { 
        background: radial-gradient(circle, #003d66 0%, var(--bg) 100%); 
        color: white; 
        font-family: 'Rajdhani', sans-serif; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        margin: 0; 
        padding: 15px; /* Respiro nas bordas do celular */
    }

    .glass { 
        background: rgba(255, 255, 255, 0.05); 
        backdrop-filter: blur(15px); 
        border: 1px solid rgba(0, 174, 239, 0.3); 
        border-radius: 30px; 
        width: 100%; 
        max-width: 400px; /* Largura ideal para celular */
        padding: 25px; 
        text-align: center; 
        box-shadow: 0 0 50px rgba(0,0,0,0.5); 
    }

    .logo { font-family: 'Orbitron'; color: var(--cielo); font-size: 18px; margin-bottom: 20px; letter-spacing: 1px; }

    .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    
    input { 
        flex: 1; 
        background: #000; 
        border: 2px solid var(--cielo); 
        border-radius: 12px; 
        padding: 15px; 
        color: #fff; 
        text-align: center; 
        font-size: 20px; /* Fonte maior para leitura fácil */
        font-family: 'Orbitron'; 
        outline: none;
        width: 100%;
    }

    .btn-camera { 
        background: var(--cielo); 
        border: none; 
        border-radius: 12px; 
        width: 65px; 
        height: 60px; /* Botão quadrado fácil de clicar */
        cursor: pointer; 
        font-size: 28px; 
        color: white; 
    }

    #reader { 
        width: 100%; 
        border-radius: 15px; 
        overflow: hidden; 
        margin-bottom: 15px; 
        display: none; 
        border: 2px solid var(--cielo); 
    }

    #fala-preview { 
        min-height: 100px; 
        font-size: 19px; 
        color: #facc15; 
        margin-bottom: 15px; 
        border: 1px solid rgba(255,255,255,0.1); 
        border-radius: 15px; 
        padding: 15px; 
        background: rgba(0,0,0,0.3); 
        text-align: left;
        line-height: 1.4;
    }

    .mic-icon { 
        width: 60px; 
        height: 60px; 
        background: var(--danger); 
        border-radius: 50%; 
        margin: 0 auto 15px; 
        display: none; 
        animation: pulse 1s infinite; 
        align-items: center; 
        justify-content: center;
        font-size: 24px;
    }

    .erro-box { 
        background: rgba(255, 75, 92, 0.2); 
        border-left: 5px solid var(--danger); 
        padding: 12px; 
        margin-top: 8px; 
        text-align: left; 
        font-size: 17px; 
        font-weight: bold; 
        border-radius: 8px; 
    }

    #timer { font-size: 70px; font-weight: 900; color: var(--cielo); margin-top: 10px; }

    /* Botão de Finalizar Gigante para o polegar */
    #btnManual { 
        width: 100%; 
        padding: 20px; 
        border-radius: 15px; 
        background: var(--cielo); 
        color: white; 
        font-weight: bold; 
        font-size: 18px;
        display: none; 
        border: none; 
        cursor: pointer; 
        text-transform: uppercase;
    }

    @keyframes pulse { 
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 75, 92, 0.7); } 
        70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(255, 75, 92, 0); } 
        100% { transform: scale(1); } 
    }
  </style>
</head>
<body>

<div class="glass">
  <div class="logo">CIELO VISTORIA <span>V22</span></div>
  
  <div class="input-group">
    <input id="serialInput" type="text" placeholder="SERIAL" autocomplete="off">
    <button class="btn-camera" onclick="abrirCamera()">📷</button>
  </div>

  <div id="reader"></div>
  
  <div id="micIcon" class="mic-icon">🎤</div>
  
  <div id="fala-preview">Aguardando início...</div>
  
  <div id="listaErros"></div>
  
  <button id="btnManual" onclick="forçarFinalizar()">FINALIZAR AGORA</button>
  
  <div id="timer"></div>
</div>

<script>
// --- CONFIG FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const dicionario = {
    "TELA QUEBRADA": ["tela", "quebrad", "trinc", "visor", "vidro"],
    "TECLADO RUIM": ["tecla", "botão", "botao", "teclad"],
    "FALTA DE RELEVO": ["relevo", "liso", "apagad"]
};

let html5QrCode;
let recognition;
let gravando = false;
let textoAcumulado = "";

function abrirCamera() {
    const readerDiv = document.getElementById('reader');
    readerDiv.style.display = 'block';
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: {width: 250, height: 150} },
        (decodedText) => {
            document.getElementById('serialInput').value = decodedText;
            html5QrCode.stop().then(() => { readerDiv.style.display = 'none'; });
            startMic();
        }
    ).catch(err => console.error(err));
}

document.getElementById('serialInput').addEventListener('change', function() {
    if(this.value.length > 2) startMic();
});

function startMic() {
    if(gravando) return;
    gravando = true;
    textoAcumulado = "";
    document.getElementById('micIcon').style.display = "flex";
    document.getElementById('btnManual').style.display = "block";
    document.getElementById('fala-preview').innerText = "Ouvindo defeitos...";

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new Speech();
    recognition.lang = "pt-BR";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let interimText = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) textoAcumulado += event.results[i][0].transcript + " ";
            else interimText += event.results[i][0].transcript;
        }
        const totalLive = (textoAcumulado + interimText).toLowerCase();
        document.getElementById('fala-preview').innerText = totalLive;

        if (totalLive.includes("pronto") || totalLive.includes("finalizar") || totalLive.includes("ok")) {
            forçarFinalizar();
        }
    };
    recognition.start();
}

function forçarFinalizar() {
    if(!gravando) return;
    gravando = false;
    const finalStr = document.getElementById('fala-preview').innerText.toLowerCase();
    if(recognition) recognition.stop();

    document.getElementById('micIcon').style.display = "none";
    document.getElementById('btnManual').style.display = "none";

    const encontrados = [];
    Object.keys(dicionario).forEach(erro => {
        if (dicionario[erro].some(p => finalStr.includes(p))) encontrados.push(erro);
    });

    const list = document.getElementById('listaErros');
    if(encontrados.length === 0) {
        list.innerHTML = "<h3 style='color:var(--cielo)'>✓ EQUIPAMENTO OK</h3>";
    } else {
        encontrados.forEach(e => { list.innerHTML += `<div class="erro-box">❌ ${e}</div>`; });
    }

    db.ref("inspecao").push({
        serial: document.getElementById('serialInput').value,
        defeitos: encontrados,
        transcricao: finalStr,
        data: new Date().toLocaleString()
    });

    let c = 5;
    const t = setInterval(() => {
        document.getElementById('timer').innerText = c--;
        if(c < 0) { clearInterval(t); location.reload(); }
    }, 1000);
}
</script>
</body>
</html>
