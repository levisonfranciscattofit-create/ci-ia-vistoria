<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielo IA | POC V8.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #020617; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .cielo-card { background: #0f172a; border: 2px solid #38bdf8; border-radius: 24px; width: 90%; max-width: 400px; padding: 2rem; text-align: center; }
    .btn { transition: all 0.2s; }
    .btn:active { scale: 0.95; }
  </style>
</head>
<body>

  <div class="cielo-card">
    <img src="https://logodownload.org/wp-content/uploads/2014/07/cielo-logo-1.png" alt="Cielo" class="h-6 mx-auto mb-6">
    
    <input id="serial" type="text" placeholder="SERIAL" class="w-full bg-black border border-slate-700 rounded-xl p-4 text-center text-xl text-sky-400 mb-4 outline-none uppercase font-mono">
    
    <button id="btnMain" onclick="iniciar()" class="btn w-full bg-sky-600 text-white font-bold py-5 rounded-xl text-lg shadow-lg shadow-sky-900/20">🎙️ OUVIR ERROS</button>
    <button id="btnStop" onclick="forcarFinalizar()" class="hidden btn w-full bg-red-600 text-white font-bold py-5 rounded-xl text-lg animate-pulse">🛑 FINALIZAR AGORA</button>

    <div id="statusArea" class="hidden mt-6 pt-6 border-t border-slate-800 text-left">
      <p id="fala" class="text-yellow-400 italic font-bold text-center mb-4 text-sm">...</p>
      <div id="lista" class="space-y-2"></div>
      <h1 id="contador" class="text-7xl font-black text-center mt-4 text-white"></h1>
    </div>
    
    <p id="debug" class="text-[10px] text-red-500 mt-4 break-all opacity-40 text-center"></p>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const API_KEY = "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"; // ⚠️ SUA CHAVE AQUI

const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let recognition;
let chunks = [];
let serialGlobal = "";

// A LISTA AGORA É CURTA E OBJETIVA
const MAPA_ERROS = {
  "RISCOS NA TELA": ["risco", "arranhado", "ralado", "riscos na tela", "tela riscada"],
  "FALTA DE RELEVO": ["relevo", "sem relevo", "falta de relevo", "serigrafia", "apagado"],
  "TECLAS DANIFICADAS": ["teclado", "tecla", "botão", "quebrado", "teclas danificadas", "tecla solta"],
  "DISPLAY QUEBRADO": ["tela quebrada", "visor", "display", "trincado", "quebrado", "display quebrado"],
  "FUGA DE LUZ": ["luz", "fuga de luz", "vazando luz", "brilho lateral", "fuga"]
};

window.iniciar = () => {
  serialGlobal = document.getElementById("serial").value.trim();
  if(!serialGlobal) return alert("Serial?");
  chunks = [];
  document.getElementById("btnMain").classList.add("hidden");
  document.getElementById("btnStop").classList.remove("hidden");
  document.getElementById("statusArea").classList.remove("hidden");
  document.getElementById("lista").innerHTML = "";

  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new Speech();
  recognition.lang = "pt-BR";
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let parcial = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) chunks.push(e.results[i][0].transcript);
      else parcial = e.results[i][0].transcript;
    }
    const t = (chunks.join(" ") + " " + parcial).toLowerCase();
    document.getElementById("fala").innerText = t;
    if(t.includes("finalizar") || t.includes("pronto")) window.forcarFinalizar();
  };
  recognition.start();
};

window.forcarFinalizar = async () => {
  if(recognition) { recognition.onresult = null; try{ recognition.stop(); }catch(i){} }
  document.getElementById("btnStop").classList.add("hidden");
  const relato = chunks.join(" ").toLowerCase();

  try {
    const resp = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY.trim() },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          { role: "system", content: "Classifique o relato do técnico em uma ou mais destas categorias: RISCOS NA TELA, FALTA DE RELEVO, TECLAS DANIFICADAS, DISPLAY QUEBRADO, FUGA DE LUZ. Se ele falar algo parecido (ex: tela trincada = DISPLAY QUEBRADO), use a categoria correta. Retorne JSON: {\"erros\": []}" },
          { role: "user", content: relato }
        ],
        temperature: 0,
        response_format: { type: "json_object" }
      })
    });

    const data = await resp.json();
    let achados = [];
    if(data.choices) {
        const content = JSON.parse(data.choices[0].message.content);
        achados = (content.erros || Object.values(content)[0] || []);
    }

    const ui = document.getElementById("lista");
    ui.innerHTML = achados.length ? "" : "<p class='text-green-500 font-bold text-center'>✓ OK</p>";
    achados.forEach(d => {
      ui.innerHTML += `<div class="bg-red-900/30 p-3 border-l-4 border-red-500 text-xs font-bold text-red-200 uppercase">❌ ${d}</div>`;
    });

    push(ref(db, "inspecao"), { serial: serialGlobal, defeitos: achados, relato_voz: relato, data: new Date().toISOString() });

    let c = 4;
    const t = setInterval(() => {
      document.getElementById("contador").innerText = c--;
      if(c < 0) { clearInterval(t); location.reload(); }
    }, 1000);

  } catch(e) {
    document.getElementById("debug").innerText = "Erro: " + e.message;
  }
};
</script>
</body>
</html>
