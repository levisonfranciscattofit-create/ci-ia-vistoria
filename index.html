<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielo IA | V8.7 POC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #020617; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .cielo-card { background: #0f172a; border: 2px solid #38bdf8; border-radius: 24px; width: 90%; max-width: 400px; padding: 2rem; text-align: center; box-shadow: 0 0 40px rgba(56,189,248,0.15); }
    .btn-main { background: #0284c7; transition: all 0.2s; shadow: 0 4px 15px rgba(2,132,199,0.4); }
    .btn-main:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="cielo-card">
    <img src="https://logodownload.org/wp-content/uploads/2014/07/cielo-logo-1.png" alt="Cielo" class="h-6 mx-auto mb-8">
    
    <input id="serial" type="text" placeholder="SERIAL DO EQUIPAMENTO" class="w-full bg-black border border-slate-700 rounded-2xl p-4 text-center text-xl text-sky-400 mb-6 outline-none uppercase font-mono tracking-widest">
    
    <button id="btnMain" onclick="iniciar()" class="btn-main w-full text-white font-black py-6 rounded-2xl text-xl uppercase">🎙️ Iniciar Voz</button>
    <button id="btnStop" onclick="forcarFinalizar()" class="hidden w-full bg-red-600 text-white font-black py-6 rounded-2xl text-xl animate-pulse uppercase">🛑 Finalizar Agora</button>

    <div id="statusArea" class="hidden mt-8 pt-8 border-t border-slate-800">
      <p id="fala" class="text-yellow-400 italic font-bold mb-6 text-lg leading-tight text-center">Ouvindo...</p>
      <div id="lista" class="space-y-3 text-left"></div>
      <h1 id="contador" class="text-7xl font-black mt-6 text-white text-center"></h1>
    </div>
    
    <div id="errorBox" class="hidden mt-6 p-4 bg-red-900/40 border border-red-500 rounded-2xl">
        <p id="debug" class="text-[10px] text-red-200 font-mono break-all text-left uppercase font-bold"></p>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ⚠️ COLE SUA NOVA API KEY AQUI (SEM ESPAÇOS)
const API_KEY = "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"; 

const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let recognition;
let chunks = [];
let serialGlobal = "";

window.iniciar = () => {
  serialGlobal = document.getElementById("serial").value.trim();
  if(!serialGlobal) return alert("Por favor, digite o Serial!");
  
  chunks = [];
  document.getElementById("btnMain").classList.add("hidden");
  document.getElementById("btnStop").classList.remove("hidden");
  document.getElementById("statusArea").classList.remove("hidden");
  document.getElementById("errorBox").classList.add("hidden");
  document.getElementById("lista").innerHTML = "";

  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Speech) return alert("Erro: Navegador não suporta reconhecimento de voz.");

  recognition = new Speech();
  recognition.lang = "pt-BR";
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let parcial = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) chunks.push(e.results[i][0].transcript);
      else parcial = e.results[i][0].transcript;
    }
    const textoVivo = (chunks.join(" ") + " " + parcial).toLowerCase();
    document.getElementById("fala").innerText = textoVivo;
    
    if(textoVivo.includes("finalizar") || textoVivo.includes("pronto")) {
        window.forcarFinalizar();
    }
  };
  recognition.start();
};

window.forcarFinalizar = async () => {
  if(recognition) { 
    recognition.onresult = null; 
    try { recognition.stop(); } catch(e) {} 
  }
  
  document.getElementById("btnStop").classList.add("hidden");
  const relatoFinal = chunks.join(" ").toLowerCase();

  try {
    const resp = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { 
        "Content-Type": "application/json", 
        "Authorization": "Bearer " + API_KEY.trim() 
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          { role: "system", content: "Você é um perito em vistorias. Extraia apenas estes erros: RISCOS NA TELA, FALTA DE RELEVO, TECLAS DANIFICADAS, DISPLAY QUEBRADO, FUGA DE LUZ. Ignore o resto. Retorne JSON: {\"erros\": []}" },
          { role: "user", content: "Relato: " + relatoFinal }
        ],
        temperature: 0,
        response_format: { type: "json_object" }
      })
    });

    if(!resp.ok) {
        const errorJson = await resp.json();
        throw new Error(errorJson.error.message || "Erro Desconhecido");
    }

    const data = await resp.json();
    const result = JSON.parse(data.choices[0].message.content);
    const errosEncontrados = result.erros || [];

    const ui = document.getElementById("lista");
    if(errosEncontrados.length === 0) {
        ui.innerHTML = "<p class='text-green-400 font-black text-center text-xl'>✓ SEM DEFEITOS</p>";
    } else {
        errosEncontrados.forEach(err => {
            ui.innerHTML += `<div class="bg-red-500/20 border-l-4 border-red-500 p-4 text-sm font-black text-red-100 uppercase">❌ ${err}</div>`;
        });
    }

    // Salva no Firebase
    push(ref(db, "inspecao"), {
      serial: serialGlobal,
      defeitos: errosEncontrados,
      texto_original: relatoFinal,
      data: new Date().toLocaleString()
    });

    // Contador para reiniciar
    let seg = 5;
    const interval = setInterval(() => {
        document.getElementById("contador").innerText = seg--;
        if(seg < 0) { clearInterval(interval); location.reload(); }
    }, 1000);

  } catch(err) {
    document.getElementById("errorBox").classList.remove("hidden");
    document.getElementById("debug").innerText = "ERRO: " + err.message;
  }
};
</script>
</body>
</html>
