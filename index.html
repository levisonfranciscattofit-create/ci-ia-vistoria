<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cielo Vistoria IA | V14 MULTI</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --cielo: #00aeef; --danger: #ff4b5c; --bg: #010a12; }
    body { background: radial-gradient(circle, #003d66 0%, var(--bg) 100%); color: white; font-family: 'Rajdhani', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(0, 174, 239, 0.3); border-radius: 40px; width: 450px; padding: 40px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
    .logo { font-family: 'Orbitron'; color: var(--cielo); font-size: 24px; margin-bottom: 25px; text-shadow: 0 0 10px var(--cielo); }
    input { width: 100%; background: #000; border: 2px solid var(--cielo); border-radius: 15px; padding: 20px; color: #fff; text-align: center; font-size: 30px; font-family: 'Orbitron'; margin-bottom: 20px; outline: none; box-sizing: border-box; }
    #fala-preview { min-height: 80px; font-size: 22px; color: #facc15; margin-bottom: 20px; font-weight: bold; line-height: 1.4; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; }
    .mic-pulse { width: 60px; height: 60px; background: var(--danger); border-radius: 50%; margin: 0 auto 20px; display: none; animation: pulse 1s infinite; align-items: center; justify-content: center; font-size: 24px; }
    .btn-finalizar { width: 100%; padding: 18px; border-radius: 15px; border: none; background: var(--cielo); color: white; font-weight: bold; font-size: 18px; cursor: pointer; display: none; margin-bottom: 10px; }
    .erro-box { background: rgba(255, 75, 92, 0.2); border-left: 5px solid var(--danger); padding: 12px; margin-top: 10px; text-align: left; font-size: 18px; font-weight: bold; animation: slideIn 0.3s forwards; }
    #timer { font-size: 80px; font-weight: 900; margin-top: 20px; color: var(--cielo); }
    @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 75, 92, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(255, 75, 92, 0); } 100% { transform: scale(1); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>

<div class="glass">
  <div class="logo">CIELO VISTORIA V14</div>
  <input id="serialInput" type="text" placeholder="BIPE O SERIAL" autofocus autocomplete="off">
  
  <div id="micIcon" class="mic-pulse">🎤</div>
  <div id="fala-preview">Aguardando bipe...</div>
  <div id="listaErros"></div>
  <button id="btnManual" class="btn-finalizar" onclick="forçarFinalizar()">FINALIZAR AGORA</button>
  <div id="timer"></div>
</div>

<script>
// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// DICIONÁRIO MULTI-VARREDURA
const dicionario = {
    "DISPLAY QUEBRADO/TRINCADO": ["tela", "display", "visor", "quebrad", "trinc", "rach", "vidro"],
    "RISCOS NA TELA": ["risc", "arranh", "marc", "ralad"],
    "TECLAS DANIFICADAS": ["tecla", "botão", "botao", "teclado", "travad", "afund"],
    "FALTA DE RELEVO": ["liso", "relevo", "apagad", "lisa"]
};

let recognition;
let gravando = false;
let silenceTimer;
let scannerTimer;

document.getElementById('serialInput').addEventListener('input', function() {
    clearTimeout(scannerTimer);
    scannerTimer = setTimeout(() => { if(this.value.length > 2) iniciarVoz(); }, 250);
});

function iniciarVoz() {
    if(gravando) return;
    gravando = true;
    
    document.getElementById('micIcon').style.display = "flex";
    document.getElementById('btnManual').style.display = "block";
    document.getElementById('fala-preview').innerText = "Ouvindo...";

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new Speech();
    recognition.lang = "pt-BR";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        const textoAtual = transcript.toLowerCase();
        document.getElementById('fala-preview').innerText = `"${textoAtual}"`;

        // Reset do timer de silêncio (Aumentei para 5s para dar tempo de respirar)
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => { if(gravando) forçarFinalizar(); }, 5000);

        // Comando de parada
        if (["ok", "pronto", "finalizar"].some(c => textoAtual.includes(c))) {
            forçarFinalizar();
        }
    };

    recognition.start();
}

function forçarFinalizar() {
    if(!gravando) return;
    gravando = false;
    
    const textoParaAnalise = document.getElementById('fala-preview').innerText.toLowerCase();
    if(recognition) recognition.stop();
    clearTimeout(silenceTimer);

    document.getElementById('micIcon').style.display = "none";
    document.getElementById('btnManual').style.display = "none";
    
    const encontrados = [];

    // LÓGICA DE VARREDURA TOTAL: Checa categoria por categoria
    Object.keys(dicionario).forEach(categoria => {
        const palavrasChave = dicionario[categoria];
        const temErro = palavrasChave.some(p => textoParaAnalise.includes(p));
        if (temErro) {
            encontrados.push(categoria);
        }
    });

    const list = document.getElementById('listaErros');
    if(encontrados.length === 0) {
        list.innerHTML = "<h2 style='color:var(--cielo)'>✓ EQUIPAMENTO OK</h2>";
    } else {
        encontrados.forEach(e => { 
            list.innerHTML += `<div class="erro-box">❌ ${e}</div>`; 
        });
    }

    // SALVAR
    db.ref("inspecao").push({
        serial: document.getElementById('serialInput').value.toUpperCase(),
        defeitos: encontrados,
        transcricao: textoParaAnalise,
        data: new Date().toLocaleString()
    });

    // RELOAD
    let c = 5;
    const t = setInterval(() => {
        document.getElementById('timer').innerText = c--;
        if(c < 0) { clearInterval(t); location.reload(); }
    }, 1000);
}
</script>
</body>
</html>
