<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cielo IA | Vistoria Pro V11</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  
  <style>
    :root { --primary: #0ea5e9; --accent: #38bdf8; --danger: #f43f5e; --bg: #020617; --card: #0f172a; }
    body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    
    .container { width: 450px; text-align: center; perspective: 1000px; }
    
    .card { 
      background: var(--card); border: 1px solid rgba(14, 165, 233, 0.3); border-radius: 30px; 
      padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); position: relative; overflow: hidden;
    }

    .logo { font-size: 24px; font-weight: 900; margin-bottom: 30px; letter-spacing: -1px; text-transform: uppercase; }
    .logo span { color: var(--primary); text-shadow: 0 0 15px rgba(14, 165, 233, 0.5); }

    input { 
      width: 100%; background: rgba(0,0,0,0.4); border: 2px solid #1e293b; border-radius: 18px; 
      padding: 20px; color: var(--accent); text-align: center; font-size: 32px; font-weight: bold; 
      margin-bottom: 25px; outline: none; transition: 0.3s; box-sizing: border-box;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(14, 165, 233, 0.2); }

    .status-area { min-height: 100px; margin-bottom: 20px; }
    
    #fala-bubble { 
      background: rgba(30, 41, 59, 0.5); padding: 15px; border-radius: 15px; 
      font-style: italic; color: #94a3b8; font-size: 16px; border: 1px solid #334155;
      display: none; animation: fadeIn 0.5s;
    }

    .btn-emergency { 
      width: 100%; padding: 20px; border-radius: 18px; border: none; color: white; 
      font-weight: 800; font-size: 18px; cursor: pointer; text-transform: uppercase;
      background: linear-gradient(135deg, #e11d48, #9f1239);
      box-shadow: 0 10px 20px rgba(225, 29, 72, 0.3);
      display: none; margin-top: 15px; transition: 0.2s;
    }
    .btn-emergency:active { transform: scale(0.98); }

    .erro-item { 
      background: rgba(244, 63, 94, 0.1); border-left: 5px solid var(--danger); 
      padding: 15px; margin-top: 10px; text-align: left; font-weight: bold;
      border-radius: 8px; animation: slideIn 0.3s forwards;
    }

    .success-msg { color: #22c55e; font-size: 22px; font-weight: 800; margin-top: 20px; }

    #countdown { font-size: 70px; font-weight: 900; color: var(--primary); margin-top: 20px; opacity: 0.8; }

    /* Animações */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="logo">CIELO <span>VISTORIA IA</span></div>
    
    <input id="serialInput" type="text" placeholder="BIPE O SERIAL" autofocus autocomplete="off">

    <div class="status-area">
      <div id="fala-bubble">"Aguardando voz..."</div>
      <div id="resultsList"></div>
      <div id="countdown"></div>
    </div>

    <button id="btnFinishManual" class="btn-emergency" onclick="triggerFinalizarManual()">
      🛑 FINALIZAR AGORA
    </button>
  </div>
</div>

<script>
// --- FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const dicionario = {
    "DISPLAY QUEBRADO": ["tela", "display", "visor", "quebrado", "trincado", "rachado"],
    "RISCOS NA TELA": ["risco", "arranhado", "marcado"],
    "TECLAS DANIFICADAS": ["tecla", "botão", "teclado", "travado"],
    "FALTA DE RELEVO": ["liso", "relevo", "apagado"]
};

let recognition;
let isRecording = false;
let scannerTimer;
let transcricaoFinal = "";

// Foco automático
document.onclick = () => document.getElementById('serialInput').focus();

// Gatilho do Scanner
document.getElementById('serialInput').addEventListener('input', function() {
    clearTimeout(scannerTimer);
    scannerTimer = setTimeout(() => {
        if(this.value.length > 2) iniciarVoz();
    }, 250); 
});

function iniciarVoz() {
    if(isRecording) return;
    isRecording = true;

    document.getElementById('fala-bubble').style.display = "block";
    document.getElementById('btnFinishManual').style.display = "block";
    document.getElementById('serialInput').style.opacity = "0.5";
    document.getElementById('serialInput').readOnly = true;

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new Speech();
    recognition.lang = "pt-BR";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        transcricaoFinal = transcript.toLowerCase();
        document.getElementById('fala-bubble').innerText = `"${transcricaoFinal}"`;
        
        if (["finalizar", "pronto", "ok", "concluir"].some(cmd => transcricaoFinal.includes(cmd))) {
            finalizarProcesso();
        }
    };
    recognition.start();
}

function triggerFinalizarManual() {
    finalizarProcesso();
}

function finalizarProcesso() {
    if(!isRecording) return;
    isRecording = false;
    
    if(recognition) recognition.stop();
    document.getElementById('btnFinishManual').style.display = "none";
    document.getElementById('fala-bubble').style.color = "var(--primary)";

    const encontrados = [];
    for (const erro in dicionario) {
        if (dicionario[erro].some(p => transcricaoFinal.includes(p))) {
            encontrados.push(erro);
        }
    }

    const list = document.getElementById('resultsList');
    if(encontrados.length === 0) {
        list.innerHTML = "<div class='success-msg'>✓ EQUIPAMENTO OK</div>";
    } else {
        encontrados.forEach(err => {
            list.innerHTML += `<div class="erro-item">❌ ${err}</div>`;
        });
    }

    // ENVIO FIREBASE
    db.ref("inspecao").push({
        serial: document.getElementById('serialInput').value.toUpperCase(),
        defeitos: encontrados,
        transcricao: transcricaoFinal,
        data: new Date().toLocaleString()
    });

    // CONTADOR
    let count = 5;
    const timer = setInterval(() => {
        document.getElementById('countdown').innerText = count--;
        if(count < 0) {
            clearInterval(timer);
            location.reload();
        }
    }, 1000);
}
</script>
</body>
</html>
