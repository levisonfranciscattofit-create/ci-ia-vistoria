<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielo IA | V8.8 POC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #020617; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .cielo-card { background: #0f172a; border: 2px solid #38bdf8; border-radius: 24px; width: 100%; max-width: 400px; padding: 2rem; text-align: center; box-shadow: 0 0 40px rgba(56,189,248,0.15); }
    .btn-main { background: #0284c7; transition: all 0.2s; }
    .btn-main:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="cielo-card">
    <img src="https://logodownload.org/wp-content/uploads/2014/07/cielo-logo-1.png" alt="Cielo" class="h-6 mx-auto mb-8">
    
    <input id="serial" type="text" placeholder="SERIAL" class="w-full bg-black border border-slate-700 rounded-2xl p-4 text-center text-xl text-sky-400 mb-6 outline-none uppercase font-mono tracking-widest">
    
    <button id="btnMain" onclick="iniciar()" class="btn-main w-full text-white font-black py-6 rounded-2xl text-xl uppercase">🎙️ Iniciar Voz</button>
    <button id="btnStop" onclick="forcarFinalizar()" class="hidden w-full bg-red-600 text-white font-black py-6 rounded-2xl text-xl animate-pulse uppercase">🛑 Finalizar Agora</button>

    <div id="statusArea" class="hidden mt-8 pt-8 border-t border-slate-800 text-left">
      <p id="fala" class="text-yellow-400 italic font-bold mb-6 text-center leading-tight">Ouvindo...</p>
      <div id="lista" class="space-y-3"></div>
      <h1 id="contador" class="text-8xl font-black mt-6 text-white text-center"></h1>
    </div>
    
    <div id="errorBox" class="hidden mt-6 p-4 bg-red-900/40 border border-red-500 rounded-2xl">
        <p id="debug" class="text-[10px] text-red-200 font-mono break-all uppercase"></p>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ⚠️ DIVIDA SUA CHAVE PARA O GITHUB NÃO BLOQUEAR
const p1 = "sk-proj-qhQeXGQFMlBlf39S0lvsiDKtqo2FgVzmHkOVtnpihGHUs7wwhy4RCQab7ozAb4HVjQUyj"; 
const p2 = "krmsAT3BlbkFJix3rynut66wsngpnVyfKSt-jRE0OfZ8uCR2fojcBQ5D5S-qrpydmaFu3Vgh1CzfFnGgUe-Gc4A";
const API_KEY = (p1 + p2).trim();

const firebaseConfig = {
  apiKey: "AIzaSyDOCUw3ZQlLUglizIUP1Ive6PA9ee_-5nI",
  authDomain: "poc-realwear.firebaseapp.com",
  databaseURL: "https://poc-realwear-default-rtdb.firebaseio.com",
  projectId: "poc-realwear"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let recognition;
let chunks = [];
let serialGlobal = "";

window.iniciar = () => {
  serialGlobal = document.getElementById("serial").value.trim();
  if(!serialGlobal) return alert("Serial?");
  chunks = [];
  document.getElementById("btnMain").classList.add("hidden");
  document.getElementById("btnStop").classList.remove("hidden");
  document.getElementById("statusArea").classList.remove("hidden");
  document.getElementById("errorBox").classList.add("hidden");
  document.getElementById("lista").innerHTML = "";

  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new Speech();
  recognition.lang = "pt-BR";
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let parcial = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) chunks.push(e.results[i][0].transcript);
      else parcial = e.results[i][0].transcript;
    }
    const t = (chunks.join(" ") + " " + parcial).toLowerCase();
    document.getElementById("fala").innerText = t;
    if(t.includes("finalizar") || t.includes("pronto")) window.forcarFinalizar();
  };
  recognition.start();
};

window.forcarFinalizar = async () => {
  if(recognition) { recognition.onresult = null; try{ recognition.stop(); }catch(i){} }
  document.getElementById("btnStop").classList.add("hidden");
  const relato = chunks.join(" ").toLowerCase();

  try {
    const resp = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          { role: "system", content: "Extraia apenas estes erros: RISCOS NA TELA, FALTA DE RELEVO, TECLAS DANIFICADAS, DISPLAY QUEBRADO, FUGA DE LUZ. Entenda sinônimos (ex: trincada = DISPLAY QUEBRADO). Retorne JSON: {\"erros\": []}" },
          { role: "user", content: relato }
        ],
        temperature: 0,
        response_format: { type: "json_object" }
      })
    });

    if(!resp.ok) throw new Error("Erro na Chave ou Saldo!");

    const data = await resp.json();
    const result = JSON.parse(data.choices[0].message.content);
    const erros = result.erros || [];

    const ui = document.getElementById("lista");
    if(!erros.length) ui.innerHTML = "<p class='text-green-400 font-black text-center text-xl uppercase'>✓ SEM DEFEITOS</p>";
    erros.forEach(e => {
        ui.innerHTML += `<div class="bg-red-500/20 border-l-4 border-red-500 p-3 text-xs font-black text-red-100 uppercase">❌ ${e}</div>`;
    });

    push(ref(db, "inspecao"), { serial: serialGlobal, defeitos: erros, data: new Date().toLocaleString() });

    let c = 5;
    const t = setInterval(() => {
        document.getElementById("contador").innerText = c--;
        if(c < 0) { clearInterval(t); location.reload(); }
    }, 1000);

  } catch(e) {
    document.getElementById("errorBox").classList.remove("hidden");
    document.getElementById("debug").innerText = "ERRO: " + e.message;
  }
};
</script>
</body>
</html>
